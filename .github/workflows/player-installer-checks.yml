name: Complete ModLab installer checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Make transaction-only package fixture
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'ModLab-package-fixture'
          New-Item -ItemType Directory -Path $fixture | Out-Null
          $names = @('ModLabLoader_P.pak','ModLabLoader_P.ucas','ModLabLoader_P.utoc','QoLSuite_P.pak','QoLSuite_P.ucas','QoLSuite_P.utoc','ModLab.html','BerserkerBuffs.png')
          $files = foreach ($name in $names) {
            $path = Join-Path $fixture $name
            [IO.File]::WriteAllText($path, 'Transaction fixture - not a playable mod')
            $folder = if ($name.StartsWith('ModLabLoader_')) { 'ModLabLoader' } else { 'QoLSuite' }
            @{ Name=$name; RelativePath=($folder + '\' + $name); Bytes=(Get-Item -LiteralPath $path).Length; SHA256=(Get-FileHash -LiteralPath $path).Hash }
          }
          @{ Schema=1; Profile='ModLab'; Version='0.1.0'; SteamBuild=25754144; Files=@($files) } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $fixture 'ModLab.manifest.json')
          "MODLAB_CI_FIXTURE=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compile and test the combined Setup EXE
        shell: pwsh
        run: ./tests/run_player_installer_checks.ps1 -PackageDirectory $env:MODLAB_CI_FIXTURE
      - name: Verify and install official Inno compiler
        shell: pwsh
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP 'ModLab-Inno-7.1.0'
          New-Item -ItemType Directory -Path $toolDir | Out-Null
          $download = Join-Path $toolDir 'innosetup-7.1.0-x64.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe' -OutFile $download
          if ((Get-FileHash -LiteralPath $download).Hash -ne '0362A383ED217D4C4239B5933866DD96D3EB2102737DA92F80F6057A4B40DF2F') { throw 'Compiler download hash mismatch.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $download
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Pyrsys B\.V\.') { throw 'Compiler signature verification failed.' }
          $compilerDir = Join-Path $toolDir 'Compiler'
          $installProcess = Start-Process -FilePath $download -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/SP-','/NORESTART','/CURRENTUSER',('/DIR="'+$compilerDir+'"')) -WindowStyle Hidden -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw 'Inno compiler installation failed.' }
          "MODLAB_INNO_COMPILER=$(Join-Path $compilerDir 'ISCC.exe')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Compile and test the standard Setup EXE
        shell: pwsh
        run: |
          ./tools/build_standard_installer.ps1 -PackageDirectory $env:MODLAB_CI_FIXTURE -InnoCompiler $env:MODLAB_INNO_COMPILER -Version 0.1.0-alpha.5
          ./tests/check_standard_worker.ps1 -BuildMetadata ./dist/player/standard-installer-build.json
          ./tests/check_modlab_setup.ps1 -SetupPath ./dist/player/ModLab-Setup-0.1.0-alpha.5.exe -PackageDirectory $env:MODLAB_CI_FIXTURE -StandardSetup
      # Tests use fake bytes only for filesystem behavior. They do not publish
      # an artifact, substitute for native game validation or contain game files.
